<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Meulebourg — aperçu des scènes (brouillons de la bible)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2b2622;
      }
      #map,
      #dev {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #dev {
        pointer-events: none;
      }
      #hud {
        position: fixed;
        left: 6px;
        top: 6px;
        padding: 4px 6px;
        border-radius: 5px;
        background: rgba(43, 38, 34, 0.82);
        color: #f3ecdc;
        font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <canvas id="dev"></canvas>
    <div id="hud"></div>
    <script type="module" src="/tools/content/preview.ts"></script>
  </body>
</html>
