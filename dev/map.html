<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Meulebourg — carte brute (moteur)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2b2622;
        overscroll-behavior: none;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #map,
      #dev {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #dev {
        pointer-events: none;
      }
      #hud {
        position: fixed;
        left: 6px;
        top: 6px;
        max-width: calc(100vw - 12px);
        box-sizing: border-box;
        padding: 5px 7px;
        border-radius: 6px;
        background: rgba(43, 38, 34, 0.82);
        color: #f3ecdc;
        font: 11px/1.35 ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        white-space: pre;
        pointer-events: none;
        overflow: hidden;
      }
      #hud b {
        color: #f3c96a;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="map" aria-label="Carte de Meulebourg"></canvas>
      <canvas id="dev"></canvas>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/dev/map.ts"></script>
  </body>
</html>
