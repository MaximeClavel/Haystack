  <circle cx="256" cy="256" r="214" fill="#3b322b"/>
  <!-- botte de foin -->
  <path d="M86 404 C 96 250, 170 150, 252 148 C 334 146, 410 246, 426 404 Z" fill="#e8b53f" stroke="#1f1814" stroke-width="12" stroke-linejoin="round"/>
  <g stroke="#a8780f" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M140 392 C 150 320, 182 250, 222 206"/>
    <path d="M190 396 C 196 330, 214 270, 246 226"/>
    <path d="M300 396 C 302 340, 296 290, 282 250"/>
    <path d="M360 394 C 352 330, 330 270, 300 226"/>
    <path d="M118 330 C 160 316, 206 314, 248 318"/>
  </g>
  <path d="M70 404 H 442" stroke="#1f1814" stroke-width="14" stroke-linecap="round"/>
  <!-- loupe -->
  <line x1="352" y1="300" x2="440" y2="388" stroke="#1f1814" stroke-width="54" stroke-linecap="round"/>
  <line x1="352" y1="300" x2="440" y2="388" stroke="#f3ecdc" stroke-width="32" stroke-linecap="round"/>
  <circle cx="290" cy="238" r="98" fill="#f3ecdc" fill-opacity="0.92" stroke="#1f1814" stroke-width="12"/>
  <circle cx="290" cy="238" r="98" fill="none" stroke="#f3ecdc" stroke-width="0"/>
  <circle cx="290" cy="238" r="80" fill="none" stroke="#1f1814" stroke-width="5" stroke-opacity="0.35"/>
  <!-- l'aiguille, trouvée -->
  <line x1="236" y1="290" x2="336" y2="188" stroke="#c0262d" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="330" cy="194" rx="9" ry="5" transform="rotate(-45 330 194)" fill="none" stroke="#f3ecdc" stroke-width="4"/>
  <circle cx="236" cy="290" r="4" fill="#c0262d"/>
</svg>
